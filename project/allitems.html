        let showItems = 10;


        function allCards() {

            const newallarray = allobj.slice(0,showItems).map((element) => {

                return `
                    <div class="all-card">
                        <img src="${element.src}" alt="" class="all-shoes-img">
                        <h1>${element.head}</h1>
                        <p>${element.price}</p>
                    </div>
                `;

            });

            div.innerHTML = newallarray.join("");


            if (showItems >= allobj.length) {
                showMore.style.display = "none";
            }

        }


        allCards();


        showMore.addEventListener("click", function () {

            showItems += 10;

            allCards();

        });
